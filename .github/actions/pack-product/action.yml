name: "Pack Umbraco.AI Product"
description: "Packs a product using pre-built outputs with package references"

inputs:
    product:
        description: "Product name (e.g., Umbraco.AI.OpenAI)"
        required: true

runs:
    using: "composite"
    steps:
        - name: Install NBGV
          shell: bash
          run: dotnet tool install --global nbgv || true

        - name: Set version
          shell: bash
          working-directory: ${{ inputs.product }}
          run: nbgv cloud

        - name: Restore packages
          shell: bash
          run: |
              attempt=1
              max_attempts=3
              delay=15
              while true; do
                if dotnet restore ${{ inputs.product }}/${{ inputs.product }}.slnx; then
                  break
                fi
                if [ $attempt -ge $max_attempts ]; then
                  echo "::error::dotnet restore failed after $attempt attempts"
                  exit 1
                fi
                echo "::warning::dotnet restore failed (attempt $attempt/$max_attempts), retrying in ${delay}s..."
                sleep $delay
                attempt=$((attempt + 1))
                delay=$((delay * 2))
              done

        - name: Pack ${{ inputs.product }}
          shell: bash
          run: |
              dotnet pack ${{ inputs.product }}/${{ inputs.product }}.slnx \
                --configuration Release \
                --no-build \
                --output ./artifacts/nupkg \
                -p:UseProjectReferences=false

        - name: Upload packages
          uses: actions/upload-artifact@v4
          with:
              name: ${{ inputs.product }}-packages
              path: ./artifacts/nupkg/${{ inputs.product }}*.nupkg
