# Azure DevOps CI Pipeline for Umbraco.AI
# Converted from GitHub Actions (.github/workflows/ci.yml)

# ============================================================
# Product Definitions - UPDATE HERE WHEN ADDING NEW PACKAGES
# ============================================================
# Level 0: Core package (no internal dependencies)
# Level 1: All packages that depend on Core
# Level 2: All packages that depend on Level 1 packages
parameters:
    - name: tiers
      type: object
      default:
          - level: 0
            products:
                - name: Umbraco.AI
                  change_var: CoreChanged
                  has_npm: true
          - level: 1
            products:
                - name: Umbraco.AI.OpenAI
                  change_var: OpenaiChanged
                  has_npm: false
                - name: Umbraco.AI.Anthropic
                  change_var: AnthropicChanged
                  has_npm: false
                - name: Umbraco.AI.DeepSeek
                  change_var: DeepseekChanged
                  has_npm: false
                - name: Umbraco.AI.Amazon
                  change_var: AmazonChanged
                  has_npm: false
                - name: Umbraco.AI.Alibaba
                  change_var: AlibabaChanged
                  has_npm: false
                - name: Umbraco.AI.Google
                  change_var: GoogleChanged
                  has_npm: false
                - name: Umbraco.AI.MicrosoftFoundry
                  change_var: MicrosoftfoundryChanged
                  has_npm: false
                - name: Umbraco.AI.FireworksAI
                  change_var: FireworksaiChanged
                  has_npm: false
                - name: Umbraco.AI.HuggingFace
                  change_var: HuggingfaceChanged
                  has_npm: false
                - name: Umbraco.AI.Mistral
                  change_var: MistralChanged
                  has_npm: false
                - name: Umbraco.AI.OpenRouter
                  change_var: OpenrouterChanged
                  has_npm: false
                - name: Umbraco.AI.TogetherAI
                  change_var: TogetheraiChanged
                  has_npm: false
                - name: Umbraco.AI.Moonshot
                  change_var: MoonshotChanged
                  has_npm: false
                - name: Umbraco.AI.ZAI
                  change_var: ZaiChanged
                  has_npm: false
                - name: Umbraco.AI.TypeSafe
                  change_var: TypesafeChanged
                  has_npm: false
                - name: Umbraco.AI.Search
                  change_var: SearchChanged
                  has_npm: false
                - name: Umbraco.AI.Prompt
                  change_var: PromptChanged
                  has_npm: false
                - name: Umbraco.AI.Agent
                  change_var: AgentChanged
                  has_npm: true
                - name: Umbraco.AI.Deploy
                  change_var: DeployChanged
                  has_npm: false
          - level: 2
            products:
                - name: Umbraco.AI.Agent.UI
                  change_var: AgentUiChanged
                  has_npm: true
                - name: Umbraco.AI.Prompt.Deploy
                  change_var: PromptDeployChanged
                  has_npm: false
                - name: Umbraco.AI.Agent.Deploy
                  change_var: AgentDeployChanged
                  has_npm: false
                - name: Umbraco.AI.Automate
                  change_var: AutomateChanged
                  has_npm: false
          - level: 3
            products:
                - name: Umbraco.AI.Agent.Copilot
                  change_var: AgentCopilotChanged
                  has_npm: true
                - name: Umbraco.AI.Agent.Copilot.Workspace
                  change_var: AgentCopilotWorkspaceChanged
                  has_npm: false
    # Queue-time override: pack dev builds with NuGet version ranges instead of
    # project references. Dev normally packs with project references, which pins
    # dependencies to the exact preview versions computed at build time - those
    # only resolve if the entire dependency chain is packed in the same build.
    # Tick this when a nightly of a single product must be installable against
    # already-published dependency versions.
    - name: packWithNuGetRanges
      displayName: Pack with NuGet version ranges (dev only override)
      type: boolean
      default: false

    # Queue-time override: pack every product regardless of what changed, and allow
    # packing from a vN/feature/* branch. Feature branches normally build and test but
    # never pack, and change detection normally narrows the pack list to what the branch
    # touched. Tick this to get a full set of installable packages out of a feature
    # branch - e.g. to hand-publish a nightly of in-progress work for testing.
    #
    # Implies preview-style packing (project references), the same mode vN/dev uses,
    # unless packWithNuGetRanges is also ticked. That is required rather than merely
    # preferable: ranged packing recompiles each product against its declared dependency
    # floor resolved from a feed, and a feature branch's computed version is a prerelease
    # that a [X.Y.0, X.999.999) range will not accept - so restore silently falls back to
    # the newest published stable and the product compiles against a Core that predates
    # whatever the branch is adding. Packing the whole chain from source in one run is
    # exactly the case project-reference pinning is for.
    - name: forcePackAll
      displayName: Pack all products (allows packing a feature branch)
      type: boolean
      default: false

    # Queue-time override: generate SBOMs and run the license policy check on any branch.
    # SBOMs normally only run on vN/release/* and vN/hotfix/*, where they are also uploaded to
    # Dependency-Track. Elsewhere this covers every product and never uploads, so in-progress
    # versions don't land in Dependency-Track.
    - name: generateSbom
      displayName: Generate SBOMs and check licenses (no upload off release/hotfix)
      type: boolean
      default: false

trigger:
    branches:
        include:
            - v*/main
            - v*/dev
            - v*/release/*
            - v*/hotfix/*
            - v*/feature/*

pr:
    branches:
        include:
            - v*/main
            - v*/dev

resources:
    repositories:
        - repository: build
          type: github
          name: umbraco/Umbraco.Build
          ref: refs/heads/feature/monorepo-pack-steps
          endpoint: umbraco

variables:
    - group: dependency-track
    - name: NODE_VERSION
      value: "24.x"
    - name: DOTNET_NOLOGO
      value: "true"
    - name: DOTNET_CLI_TELEMETRY_OPTOUT
      value: "true"

stages:
    # ============================================================
    # Build & Test everything
    # ============================================================
    - stage: Build
      displayName: Build & Test
      jobs:
          - job: BuildAndTest
            displayName: Build & Test
            pool:
                vmImage: "ubuntu-latest"
            steps:
                - checkout: self
                  fetchDepth: 0

                # Set here rather than in a stage of its own, which cost an agent and its wait
                - template: devops/monorepo/steps/set-build-number.yml@build

                - task: UseDotNet@2
                  displayName: Setup .NET
                  inputs:
                      useGlobalJson: true

                - task: UseNode@1
                  displayName: Setup Node.js
                  inputs:
                      version: $(NODE_VERSION)

                - script: |
                      npm ci --include=optional
                      npm run build
                  displayName: Build frontend

                - script: npm test
                  displayName: Test frontend

                - task: PublishTestResults@2
                  displayName: Publish frontend test results
                  condition: always()
                  inputs:
                      testResultsFormat: JUnit
                      testResultsFiles: "**/Client/test-results/junit.xml"
                      searchFolder: $(Build.SourcesDirectory)
                      mergeTestResults: true
                      testRunTitle: Frontend
                      failTaskOnMissingResultsFile: true

                - script: |
                      attempt=1
                      max_attempts=3
                      delay=15
                      while true; do
                        if dotnet restore Umbraco.AI.slnx; then
                          break
                        fi
                        if [ $attempt -ge $max_attempts ]; then
                          echo "##[error]dotnet restore failed after $attempt attempts"
                          exit 1
                        fi
                        echo "##[warning]dotnet restore failed (attempt $attempt/$max_attempts), retrying in ${delay}s..."
                        sleep $delay
                        attempt=$((attempt + 1))
                        delay=$((delay * 2))
                      done
                  displayName: Restore

                - script: dotnet build Umbraco.AI.slnx --configuration Release --no-restore -p:DisableCloudBuildNumber=true
                  displayName: Build

                - script: dotnet test Umbraco.AI.slnx --configuration Release --no-build --verbosity normal --logger trx --results-directory $(Agent.TempDirectory)/TestResults
                  displayName: Test .NET

                - task: PublishTestResults@2
                  displayName: Publish test results
                  condition: always()
                  inputs:
                      testResultsFormat: VSTest
                      testResultsFiles: "$(Agent.TempDirectory)/TestResults/**/*.trx"
                      mergeTestResults: true
                      testRunTitle: .NET

                - task: PublishPipelineArtifact@1
                  displayName: Upload build outputs
                  inputs:
                      targetPath: $(Build.SourcesDirectory)
                      artifact: build-outputs
                      publishLocation: pipeline

    # ============================================================
    # Generate & Upload SBOMs - Only runs on push to vN/release/* and vN/hotfix/*, or on any
    # branch when generateSbom is ticked at queue time (generate + license check, no upload)
    # Covers only the products being released (same change detection as Pack), uploads them to
    # Dependency-Track, and gates Pack: a license policy violation stops the release
    # ============================================================
    - template: devops/monorepo/stages/sbom.yml@build
      parameters:
          core_product: Umbraco.AI
          tiers: ${{ parameters.tiers }}
          policy_allow_file: .sbom-policy.json
          node_version: $(NODE_VERSION)
          depends_on: [Build]
          condition: |
              and(
                succeeded(),
                ne(variables['Build.Reason'], 'PullRequest'),
                or(
                  eq('${{ parameters.generateSbom }}', 'true'),
                  contains(variables['Build.SourceBranch'], '/release/'),
                  contains(variables['Build.SourceBranch'], '/hotfix/')
                )
              )
          all_products: ${{ or(parameters.forcePackAll, and(parameters.generateSbom, not(contains(variables['Build.SourceBranch'], '/release/')), not(contains(variables['Build.SourceBranch'], '/hotfix/')))) }}
          upload: ${{ or(contains(variables['Build.SourceBranch'], '/release/'), contains(variables['Build.SourceBranch'], '/hotfix/')) }}

    # ============================================================
    # Validate Changelogs - Only runs on push to vN/release/* and vN/hotfix/*
    # Ensures CHANGELOGs are present and match version.json
    # ============================================================
    - template: devops/monorepo/stages/validate-changelogs.yml@build
      parameters:
          depends_on: [Build]

    # ============================================================
    # Pack Stage - Only runs on push to main/dev/hotfix/release branches
    # Uses dynamic change detection to only pack products that changed
    # Waits for GenerateSBOM so a license policy violation stops a release before it is packed
    # ============================================================
    - template: devops/monorepo/stages/pack.yml@build
      parameters:
          core_product: Umbraco.AI
          tiers: ${{ parameters.tiers }}
          depends_on:
              - Build
              - ValidateChangelogs
              - GenerateSBOM
          condition: |
              and(
                in(dependencies.Build.result, 'Succeeded'),
                in(dependencies.ValidateChangelogs.result, 'Succeeded', 'Skipped'),
                in(dependencies.GenerateSBOM.result, 'Succeeded', 'SucceededWithIssues', 'Skipped'),
                ne(variables['Build.Reason'], 'PullRequest'),
                or(
                  eq('${{ parameters.forcePackAll }}', 'true'),
                  contains(variables['Build.SourceBranch'], '/hotfix/'),
                  contains(variables['Build.SourceBranch'], '/release/'),
                  endsWith(variables['Build.SourceBranch'], '/main'),
                  endsWith(variables['Build.SourceBranch'], '/dev')
                )
              )
          force_all: ${{ parameters.forcePackAll }}
          use_project_references: ${{ and(or(endsWith(variables['Build.SourceBranch'], '/dev'), parameters.forcePackAll), not(parameters.packWithNuGetRanges)) }}
